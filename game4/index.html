meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta http-equiv="Content-Security-Policy" content="default-src * data:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
	<script src="enchant.min.js"></script>
	<script src="data.js"></script>
	<script src="main.js"></script>
	<style type="text/css">
	body {
		margin: 0px;
		padding: 0px;
		background-color: #000; /* 読み込み中に一瞬白くなるのを防ぐため黒に */
	}
	</style>
	<script>
		// 画面のどこかをタッチしたときに実行される関数
		function requestSensorPermission() {
			// iOS (iPhone) や最新のAndroid向けの傾きセンサーの許可申請
			if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
				DeviceOrientationEvent.requestPermission()
					.then(permissionState => {
						if (permissionState === 'granted') {
							console.log("傾きセンサーの利用が許可されました");
							// 許可されたら、main.js側で新しく作ったセンサー監視を開始する
							if (typeof setDefaultAccel === 'function') { setDefaultAccel(); }
						}
						// スタート画面（案内文字）を消す
						hideStartMessage();
					})
					.catch(error => {
						console.error("センサー許可エラー:", error);
						hideStartMessage();
					});
			} else {
				// 許可申請が不要な古いブラウザやAndroid環境の場合
				if (typeof setDefaultAccel === 'function') { setDefaultAccel(); }
				hideStartMessage();
			}
		}

		// スタート案内画面を消す関数
		function hideStartMessage() {
			var msgDiv = document.getElementById('msg');
			if (msgDiv) {
				msgDiv.style.display = 'none';
			}
		}
	</script>
</head>
<body>
	<!-- ゲーム画面の上に、透明な「タッチを感知するための膜」を1枚被せる作りに変更します -->
	<div id="msg" style="position:absolute; width:100%; height:100%; background-color:rgba(187,187,187,0.85); font-size:24pt; z-index:998; text-align:center; padding-top:20%; color:#000; cursor:pointer;" onclick="requestSensorPermission();">
		TOUCH to START<br>
		<span style="font-size:14pt; color:#333;">(傾きセンサーの許可)</span>
	</div>
    <a href="../index.html" style="color: #fff; position: absolute; top: 10px; right: 10px; z-index: 999; font-weight: bold; background-color: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; text-decoration: none;">メニューに戻る</a>
</body>
</html>
