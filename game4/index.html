<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta http-equiv="Content-Security-Policy" content="default-src * data:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">

	<script src="enchant.min.js"></script>
	<script src="data.js"></script>
	<script src="main.js"></script>

	<style type="text/css">
	body {
		margin: 0px;
		padding: 0px;
		background-color: #000;
	}
	</style>

	<script>
		// 画面の「TOUCH to START」が押されたときに実行される関数
		function clickStart() {
			// ① iOS(iPhone)や最新Androidブラウザ向けの傾きセンサーの許可申請
			if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
				DeviceOrientationEvent.requestPermission()
					.then(permissionState => {
						if (permissionState === 'granted') {
							console.log("傾きセンサーの利用が許可されました");
						}
						// センサー許可を求めた後、本物のゲーム起動処理（main.jsのstartNow）を呼び出す！
						runRealGame();
					})
					.catch(error => {
						console.error("センサー許可エラー:", error);
						runRealGame();
					});
			} else {
				// 許可申請が不要な通常のブラウザ環境の場合
				runRealGame();
			}
		}

		// main.jsのゲーム起動処理と傾きセンサーの監視を連動させて開始する関数
		function runRealGame() {
			// main.js側にもともと用意されている、本物のゲーム開始関数を呼び出す
			if (typeof startNow === 'function') {
				startNow();
			}
			// main.jsの最下部に新しく作ったセンサー監視命令をここで呼び出す
			if (typeof setDefaultAccel === 'function') {
				setDefaultAccel();
			}
		}
	</script>
</head>
<body>
	<!-- 最初の案内画面（クリックされたら上の clickStart() を呼び出します） -->
	<div id="msg" style="position:absolute; width:100%; height:100%; background-color:#bbb; font-size:24pt; z-index:998; text-align:center; padding-top:20%; color:#000; cursor:pointer;" onclick="clickStart();">
		TOUCH to START<br>
		<span style="font-size:14pt; color:#333;">(傾きセンサーの許可)</span>
	</div>
    <a href="../index.html" style="color: #fff; position: absolute; top: 10px; right: 10px; z-index: 999; font-weight: bold; background-color: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; text-decoration: none;">メニューに戻る</a>
</body>
</html>
